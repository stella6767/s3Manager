<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3 Browser</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-100">
<div class="container mx-auto p-4 max-w-7xl">
    <!-- Header -->
    <div class="navbar bg-base-100 border-b mb-6">
        <div class="navbar-start">
            <h1 class="text-2xl font-bold text-primary">S3 Browser</h1>
        </div>
        <div class="navbar-end">
            <button id="disconnect-btn" class="btn btn-outline btn-sm" style="display: none;">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                연결 해제
            </button>
        </div>
    </div>

    <!-- Connection Form -->
    <div id="connection-form" class="card bg-base-100 shadow-xl mb-6">
        <div class="card-body">
            <h2 class="card-title text-lg mb-4">
                <svg class="w-6 h-6 text-warning" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                AWS S3 연결 설정
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Region</span>
                    </label>
                    <select id="region-select" class="select select-bordered">
                        <option value="us-east-1">US East (N. Virginia)</option>
                        <option value="us-west-2">US West (Oregon)</option>
                        <option value="eu-west-1">Europe (Ireland)</option>
                        <option value="ap-northeast-1">Asia Pacific (Tokyo)</option>
                        <option value="ap-northeast-2" selected>Asia Pacific (Seoul)</option>
                        <option value="ap-southeast-1">Asia Pacific (Singapore)</option>
                    </select>
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Bucket Name</span>
                    </label>
                    <input type="text" id="bucket-input" placeholder="my-bucket-name" class="input input-bordered" />
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Access Key ID</span>
                    </label>
                    <input type="text" id="access-key-input" placeholder="AKIA..." class="input input-bordered" />
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Secret Access Key</span>
                    </label>
                    <input type="password" id="secret-key-input" placeholder="••••••••" class="input input-bordered" />
                </div>
            </div>

            <div class="card-actions justify-end mt-4">
                <button id="connect-btn" class="btn btn-primary">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    연결하기
                </button>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="flex justify-center items-center py-12" style="display: none;">
        <div class="loading loading-spinner loading-lg text-primary"></div>
        <span class="ml-3 text-lg">S3 버킷에 연결 중...</span>
    </div>

    <!-- Browser Interface -->
    <div id="browser-interface" style="display: none;">
        <!-- Breadcrumb -->
        <div class="breadcrumbs text-sm mb-4">
            <ul id="breadcrumb-list">
                <li><a class="breadcrumb-item" data-path="">🪣 <span id="bucket-name-display"></span></a></li>
            </ul>
        </div>

        <!-- Actions -->
        <div class="flex gap-2 mb-4">
            <button id="upload-btn" class="btn btn-primary btn-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                업로드
            </button>
            <button id="create-folder-btn" class="btn btn-outline btn-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                </svg>
                폴더 생성
            </button>
            <button id="refresh-btn" class="btn btn-ghost btn-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                새로고침
            </button>
        </div>

        <!-- File Explorer -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <!-- Folder Tree -->
            <div class="card bg-base-100 shadow">
                <div class="card-body p-4">
                    <h3 class="font-semibold mb-3 flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                        </svg>
                        폴더 트리
                    </h3>
                    <div id="folder-tree" class="max-h-96 overflow-y-auto">
                        <!-- Folder tree will be populated here -->
                    </div>
                </div>
            </div>

            <!-- File List -->
            <div class="lg:col-span-2">
                <div class="card bg-base-100 shadow">
                    <div class="card-body p-4">
                        <h3 class="font-semibold mb-3 flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            파일 목록
                            <span id="file-count" class="badge badge-ghost ml-2">0</span>
                        </h3>
                        <div id="file-list" class="max-h-96 overflow-y-auto">
                            <!-- File list will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Alert -->
    <div id="error-alert" class="alert alert-error mt-4" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span id="error-message"></span>
    </div>
</div>

<!-- File Upload Modal -->
<input type="file" id="file-input" multiple style="display: none;">

<script>
    class S3Browser {
        constructor() {
            this.currentPath = '';
            this.s3Client = null;
            this.bucketName = '';
            this.credentials = null;
            this.folderStructure = new Map();

            this.initEventListeners();
        }

        initEventListeners() {
            document.getElementById('connect-btn').addEventListener('click', () => this.connect());
            document.getElementById('disconnect-btn').addEventListener('click', () => this.disconnect());
            document.getElementById('upload-btn').addEventListener('click', () => this.upload());
            document.getElementById('create-folder-btn').addEventListener('click', () => this.createFolder());
            document.getElementById('refresh-btn').addEventListener('click', () => this.refresh());
            document.getElementById('file-input').addEventListener('change', (e) => this.handleFileUpload(e));
        }

        async connect() {
            const region = document.getElementById('region-select').value;
            const bucket = document.getElementById('bucket-input').value.trim();
            const accessKey = document.getElementById('access-key-input').value.trim();
            const secretKey = document.getElementById('secret-key-input').value.trim();

            if (!bucket || !accessKey || !secretKey) {
                this.showError('모든 필드를 입력해주세요.');
                return;
            }

            this.showLoading(true);
            this.hideError();

            try {
                // 실제 구현에서는 백엔드 API를 호출해야 합니다
                const response = await this.callBackendAPI('/api/s3/connect', {
                    region,
                    bucket,
                    accessKey,
                    secretKey
                });

                if (response.success) {
                    this.bucketName = bucket;
                    this.credentials = { region, accessKey, secretKey };

                    document.getElementById('bucket-name-display').textContent = bucket;
                    document.getElementById('connection-form').style.display = 'none';
                    document.getElementById('browser-interface').style.display = 'block';
                    document.getElementById('disconnect-btn').style.display = 'block';

                    await this.loadFileList('');
                    await this.buildFolderTree();
                } else {
                    throw new Error(response.message || '연결에 실패했습니다.');
                }
            } catch (error) {
                this.showError(`연결 실패: ${error.message}`);
            } finally {
                this.showLoading(false);
            }
        }

        disconnect() {
            this.currentPath = '';
            this.bucketName = '';
            this.credentials = null;
            this.folderStructure.clear();

            document.getElementById('connection-form').style.display = 'block';
            document.getElementById('browser-interface').style.display = 'none';
            document.getElementById('disconnect-btn').style.display = 'none';

            // Clear form
            document.getElementById('bucket-input').value = '';
            document.getElementById('access-key-input').value = '';
            document.getElementById('secret-key-input').value = '';

            this.hideError();
        }

        async callBackendAPI(endpoint, data) {
            const baseUrl = 'http://localhost:8080'; // Spring Boot 서버 주소

            try {
                const options = {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                };

                // FormData인 경우 (파일 업로드)
                if (data instanceof FormData) {
                    delete options.headers['Content-Type']; // 브라우저가 자동으로 설정
                    options.body = data;
                } else {
                    options.body = JSON.stringify({
                        ...data,
                        ...this.credentials
                    });
                }

                const response = await fetch(baseUrl + endpoint, options);
                const result = await response.json();

                return result;
            } catch (error) {
                console.error('API 호출 실패:', error);
                return { success: false, message: error.message };
            }
        }

        getMockFileList(prefix = '') {
            // 실제 S3 데이터 시뮬레이션
            const mockData = [
                { key: 'documents/', isDirectory: true, size: 0, lastModified: new Date() },
                { key: 'documents/report.pdf', isDirectory: false, size: 1024000, lastModified: new Date() },
                { key: 'documents/presentation.pptx', isDirectory: false, size: 2048000, lastModified: new Date() },
                { key: 'images/', isDirectory: true, size: 0, lastModified: new Date() },
                { key: 'images/logo.png', isDirectory: false, size: 512000, lastModified: new Date() },
                { key: 'images/banner.jpg', isDirectory: false, size: 800000, lastModified: new Date() },
                { key: 'videos/', isDirectory: true, size: 0, lastModified: new Date() },
                { key: 'videos/intro.mp4', isDirectory: false, size: 10240000, lastModified: new Date() },
                { key: 'config.json', isDirectory: false, size: 1024, lastModified: new Date() },
                { key: 'README.md', isDirectory: false, size: 2048, lastModified: new Date() }
            ];

            const filteredData = mockData.filter(item =>
                item.key.startsWith(prefix) &&
                item.key !== prefix &&
                (item.key.substring(prefix.length).indexOf('/') === -1 || item.key.endsWith('/'))
            );

            return { success: true, data: filteredData };
        }

        async loadFileList(path) {
            try {
                const response = await this.callBackendAPI('/api/s3/list', {
                    bucket: this.bucketName,
                    prefix: path
                });

                if (response.success) {
                    this.renderFileList(response.data);
                    this.updateBreadcrumb(path);
                    this.currentPath = path;
                }
            } catch (error) {
                this.showError(`파일 목록 로드 실패: ${error.message}`);
            }
        }

        renderFileList(files) {
            const fileList = document.getElementById('file-list');
            const fileCount = document.getElementById('file-count');

            fileCount.textContent = files.length;

            if (files.length === 0) {
                fileList.innerHTML = '<div class="text-center text-base-content/50 py-8">폴더가 비어있습니다</div>';
                return;
            }

            fileList.innerHTML = files.map(file => {
                const isFolder = file.isDirectory;
                const icon = isFolder ? '📁' : this.getFileIcon(file.key);
                const size = isFolder ? '' : this.formatFileSize(file.size);
                const date = file.lastModified.toLocaleDateString();

                return `
                        <div class="flex items-center p-3 hover:bg-base-200 rounded cursor-pointer border-b border-base-300 last:border-b-0"
                             onclick="s3Browser.${isFolder ? 'openFolder' : 'downloadFile'}('${file.key}')">
                            <span class="text-2xl mr-3">${icon}</span>
                            <div class="flex-1">
                                <div class="font-medium">${this.getFileName(file.key)}</div>
                                <div class="text-sm text-base-content/60">${date} ${size}</div>
                            </div>
                            ${!isFolder ? `
                                <div class="dropdown dropdown-end">
                                    <div tabindex="0" role="button" class="btn btn-ghost btn-sm" onclick="event.stopPropagation()">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01"></path>
                                        </svg>
                                    </div>
                                    <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-[1] w-32 p-2 shadow">
                                        <li><a onclick="s3Browser.downloadFile('${file.key}')">다운로드</a></li>
                                        <li><a onclick="s3Browser.deleteFile('${file.key}')" class="text-error">삭제</a></li>
                                    </ul>
                                </div>
                            ` : ''}
                        </div>
                    `;
            }).join('');
        }

        async buildFolderTree() {
            try {
                const response = await this.callBackendAPI('/api/s3/list', {
                    bucket: this.bucketName,
                    prefix: ''
                });

                if (response.success) {
                    const folders = response.data.filter(item => item.isDirectory);
                    this.renderFolderTree(folders);
                }
            } catch (error) {
                console.error('폴더 트리 구성 실패:', error);
            }
        }

        renderFolderTree(folders) {
            const folderTree = document.getElementById('folder-tree');
            const tree = this.buildTreeStructure(folders);
            folderTree.innerHTML = this.renderTreeNode(tree, '');
        }

        buildTreeStructure(folders) {
            const tree = {};

            folders.forEach(folder => {
                const parts = folder.key.replace(/\/$/, '').split('/');
                let current = tree;

                parts.forEach((part, index) => {
                    if (!current[part]) {
                        current[part] = { children: {}, path: parts.slice(0, index + 1).join('/') + '/' };
                    }
                    current = current[part].children;
                });
            });

            return tree;
        }

        renderTreeNode(node, prefix = '') {
            return Object.keys(node).map(key => {
                const item = node[key];
                const hasChildren = Object.keys(item.children).length > 0;

                return `
                        <div class="ml-${prefix.length * 4}">
                            <div class="flex items-center py-1 hover:bg-base-200 rounded cursor-pointer"
                                 onclick="s3Browser.openFolder('${item.path}')">
                                <span class="mr-2">${hasChildren ? '📁' : '📂'}</span>
                                <span class="text-sm">${key}</span>
                            </div>
                            ${hasChildren ? this.renderTreeNode(item.children, prefix + '  ') : ''}
                        </div>
                    `;
            }).join('');
        }

        openFolder(path) {
            this.loadFileList(path);
        }

        async downloadFile(key) {
            try {
                const response = await this.callBackendAPI('/api/s3/download', {
                    key: key
                });

                if (response.success) {
                    // Presigned URL로 다운로드
                    const link = document.createElement('a');
                    link.href = response.url;
                    link.download = this.getFileName(key);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } else {
                    throw new Error(response.message);
                }
            } catch (error) {
                this.showError(`다운로드 실패: ${error.message}`);
            }
        }

        upload() {
            document.getElementById('file-input').click();
        }

        async handleFileUpload(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;

            this.showLoading(true);

            try {
                for (const file of files) {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('bucket', this.bucketName);
                    formData.append('key', this.currentPath + file.name);
                    formData.append('region', this.credentials.region);
                    formData.append('accessKey', this.credentials.accessKey);
                    formData.append('secretKey', this.credentials.secretKey);

                    const response = await this.callBackendAPI('/api/s3/upload', formData);
                    if (!response.success) {
                        throw new Error(`${file.name} 업로드 실패: ${response.message}`);
                    }
                }

                await this.refresh();
                alert('업로드 완료');
            } catch (error) {
                this.showError(`업로드 실패: ${error.message}`);
            } finally {
                this.showLoading(false);
                event.target.value = '';
            }
        }

        async createFolder() {
            const folderName = prompt('폴더 이름을 입력하세요:');
            if (!folderName) return;

            try {
                const response = await this.callBackendAPI('/api/s3/create-folder', {
                    bucket: this.bucketName,
                    key: this.currentPath + folderName + '/'
                });

                if (response.success) {
                    await this.refresh();
                    alert('폴더 생성 완료');
                }
            } catch (error) {
                this.showError(`폴더 생성 실패: ${error.message}`);
            }
        }

        async refresh() {
            await this.loadFileList(this.currentPath);
            await this.buildFolderTree();
        }

        updateBreadcrumb(path) {
            const breadcrumb = document.getElementById('breadcrumb-list');
            const parts = path.split('/').filter(part => part);

            let html = `<li><a class="breadcrumb-item" data-path="" onclick="s3Browser.openFolder('')">🪣 ${this.bucketName}</a></li>`;

            let currentPath = '';
            parts.forEach(part => {
                currentPath += part + '/';
                html += `<li><a class="breadcrumb-item" data-path="${currentPath}" onclick="s3Browser.openFolder('${currentPath}')">${part}</a></li>`;
            });

            breadcrumb.innerHTML = html;
        }

        getFileName(key) {
            return key.split('/').pop() || key;
        }

        getFileIcon(filename) {
            const ext = filename.split('.').pop()?.toLowerCase();
            const iconMap = {
                pdf: '📄', doc: '📄', docx: '📄', txt: '📄',
                jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', svg: '🖼️',
                mp4: '🎥', avi: '🎥', mov: '🎥', wmv: '🎥',
                mp3: '🎵', wav: '🎵', flac: '🎵',
                zip: '📦', rar: '📦', tar: '📦', gz: '📦',
                js: '💻', html: '💻', css: '💻', json: '💻', xml: '💻'
            };
            return iconMap[ext] || '📄';
        }

        formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        showError(message) {
            document.getElementById('error-message').textContent = message;
            document.getElementById('error-alert').style.display = 'flex';
            setTimeout(() => this.hideError(), 5000);
        }

        hideError() {
            document.getElementById('error-alert').style.display = 'none';
        }
    }

    // Initialize the S3 Browser
    const s3Browser = new S3Browser();
</script>
</body>
</html>
