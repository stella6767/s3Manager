<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3 파일 업로드 with Dropzone.js</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.2/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>

    <style>
        /* Dropzone 기본 메시지 숨기기 및 커서 포인터 유지 */
        #my-dropzone .dz-message {
            margin: 0;
        }
        /* Dropzone이 만드는 기본 프리뷰 숨기기 (우리 템플릿만 사용) */
        .dz-preview {
            display: none;
        }
    </style>
</head>
<body class="bg-base-100 text-base-content">

<main class="max-w-6xl mx-auto p-4 md:p-8">
    <div class="border-b pb-4 mb-6">
        <h1 class="text-2xl font-semibold">업로드</h1>
    </div>

    <form id="my-dropzone" class="dropzone border-2 border-dashed rounded-lg p-8 text-center bg-base-200 hover:border-primary cursor-pointer transition-colors">
        <div class="dz-message flex flex-col items-center justify-center gap-4">
            <svg class="w-12 h-12 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l-3 3m3-3l3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.33-2.33 3 3 0 013.75 5.625" /></svg>
            <p class="text-lg font-medium text-base-content">여기에 파일을 끌어 놓거나, 클릭하여 파일을 선택하세요.</p>
        </div>
    </form>

    <div id="file-list-section" class="mt-8">
        <div class="flex flex-wrap justify-between items-center gap-4 mb-4">
            <h2 class="text-xl font-semibold">파일 및 폴더 (<span id="file-count">0</span>)</h2>
            <div class="flex gap-2">
                <button type="button" id="clear-btn" class="btn btn-ghost">지우기</button>
                <button type="button" id="upload-btn" class="btn btn-primary" disabled>업로드</button>
            </div>
        </div>

        <div class="mb-4">
            <p class="text-sm mb-1">총 파일 크기: <span id="total-size">0 B</span></p>
            <progress id="total-progress" class="progress progress-primary w-full" value="0" max="100"></progress>
        </div>

        <div class="overflow-x-auto border rounded-lg">
            <table class="table w-full">
                <thead>
                <tr>
                    <th><input type="checkbox" id="check-all" class="checkbox"></th>
                    <th>이름</th>
                    <th>유형</th>
                    <th>크기</th>
                    <th>상태/제거</th>
                </tr>
                </thead>
                <tbody id="file-list-tbody">
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-8">
        <h2 class="text-xl font-semibold mb-4">대상</h2>
        <div class="form-control">
            <label class="label"><span class="label-text">S3 대상 경로</span></label>
            <div class="border rounded-lg p-4 bg-base-200">
                <span class="font-mono">s3://your-bucket-name/uploads/</span>
            </div>
        </div>
    </div>

    <div class="mt-4 space-y-2">
        <div class="collapse collapse-arrow bg-base-200">
            <input type="checkbox" />
            <div class="collapse-title text-md font-medium">업로드 세부 정보</div>
            <div class="collapse-content">
                <p>업로드 관련 세부 설정(스토리지 클래스, 암호화 등)을 여기에 배치합니다.</p>
            </div>
        </div>
        <div class="collapse collapse-arrow bg-base-200">
            <input type="checkbox" />
            <div class="collapse-title text-md font-medium">속성</div>
            <div class="collapse-content">
                <p>객체 태그(Tag) 등 메타데이터 속성을 여기에 배치합니다.</p>
            </div>
        </div>
    </div>

    <div class="flex justify-end gap-4 mt-8 pt-4 border-t">
        <button class="btn">취소</button>
        <button class="btn btn-primary" onclick="document.getElementById('upload-btn').click()">업로드</button>
    </div>
</main>


<template id="preview-template">
    <tr>
        <th><input type="checkbox" class="checkbox"></th>
        <td><div class="truncate w-48" data-dz-name></div></td>
        <td data-dz-type></td>
        <td><div data-dz-size></div></td>
        <td>
            <div class="flex items-center gap-2">
                <div class="flex-grow">
                    <div class="dz-status text-sm">준비</div>
                    <progress class="progress progress-secondary w-full dz-upload" data-dz-uploadprogress value="0" max="100" style="display: none;"></progress>
                    <div class="text-error text-xs" data-dz-errormessage></div>
                </div>
                <button type="button" class="btn btn-xs btn-ghost text-error" data-dz-remove>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
        </td>
    </tr>
</template>


<script>
    document.addEventListener('DOMContentLoaded', () => {

        // Dropzone 자동 발견 기능 비활성화
        Dropzone.autoDiscover = false;

        // Dropzone 인스턴스 생성 및 설정
        const myDropzone = new Dropzone("#my-dropzone", {
            url: "/api/uploads/presigned-url", // 이 URL은 실제로 사용되지 않음 (수동 제어)
            autoProcessQueue: false,
            parallelUploads: 5,
            maxFilesize: 15000, // 15GB
            clickable: true,
            previewsContainer: "#file-list-tbody",
            previewTemplate: document.querySelector('#preview-template').innerHTML,
            addRemoveLinks: false, // 템플릿에 data-dz-remove가 있으므로 false
        });

        // 필요한 DOM 요소들
        const uploadBtn = document.getElementById('upload-btn');
        const clearBtn = document.getElementById('clear-btn');
        const fileCountEl = document.getElementById('file-count');
        const totalSizeEl = document.getElementById('total-size');

        // --- Dropzone 이벤트 핸들러 ---
        myDropzone.on("addedfile", (file) => {
            const typeEl = file.previewElement.querySelector("[data-dz-type]");
            if (typeEl) {
                typeEl.textContent = file.type || '알 수 없음';
            }
            updateSummary();
        });

        myDropzone.on("removedfile", () => updateSummary());
        myDropzone.on("reset", () => updateSummary());

        // --- 버튼 이벤트 리스너 ---
        uploadBtn.addEventListener('click', () => {
            const queuedFiles = myDropzone.getQueuedFiles();
            if (queuedFiles.length > 0) {
                uploadAllFiles(queuedFiles);
            }
        });

        clearBtn.addEventListener('click', () => {
            myDropzone.removeAllFiles(true);
        });

        // --- 핵심 함수들 ---
        function updateSummary() {
            const fileCount = myDropzone.files.length;
            const totalSize = myDropzone.files.reduce((sum, file) => sum + file.size, 0);
            fileCountEl.textContent = fileCount;
            totalSizeEl.textContent = formatBytes(totalSize);
            uploadBtn.disabled = fileCount === 0;
        }

        async function uploadAllFiles(files) {
            uploadBtn.disabled = true;
            uploadBtn.innerHTML = `<span class="loading loading-spinner"></span> 업로드 중`;
            const uploadPromises = files.map(file => uploadSingleFile(file));
            await Promise.all(uploadPromises);
            alert('모든 파일 업로드가 완료되었습니다!');
            uploadBtn.innerHTML = '업로드';
        }

        function uploadSingleFile(file) {
            return new Promise(async (resolve, reject) => {
                const statusEl = file.previewElement.querySelector('.dz-status');
                const progressEl = file.previewElement.querySelector('.dz-upload');
                const errorEl = file.previewElement.querySelector('[data-dz-errormessage]');

                try {
                    statusEl.textContent = 'URL 요청 중...';
                    const presignResponse = await fetch('/api/uploads/presigned-url', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: file.name, contentType: file.type }),
                    });

                    if (!presignResponse.ok) throw new Error('URL 요청 실패');

                    const { url: presignedUrl } = await presignResponse.json();

                    statusEl.style.display = 'none';
                    progressEl.style.display = 'block';

                    const xhr = new XMLHttpRequest();
                    xhr.open('PUT', presignedUrl, true);
                    xhr.setRequestHeader('Content-Type', file.type);

                    xhr.upload.onprogress = (event) => {
                        if (event.lengthComputable) {
                            const percent = (event.loaded / event.total) * 100;
                            progressEl.value = percent;
                        }
                    };

                    xhr.onload = () => {
                        if (xhr.status === 200) {
                            progressEl.style.display = 'none';
                            statusEl.textContent = '완료';
                            statusEl.style.display = 'block';
                            statusEl.classList.add('text-success');
                            myDropzone.emit("complete", file);
                            resolve('Success');
                        } else {
                            throw new Error(`Upload failed: ${xhr.statusText}`);
                        }
                    };

                    xhr.onerror = () => { throw new Error('Network error during upload.'); };

                    xhr.send(file);
                } catch (error) {
                    progressEl.style.display = 'none';
                    statusEl.textContent = '실패';
                    statusEl.style.display = 'block';
                    statusEl.classList.add('text-error');
                    errorEl.textContent = error.message;
                    myDropzone.emit("error", file, error.message);
                    reject(error);
                }
            });
        }

        function formatBytes(bytes, decimals = 2) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }
    });
</script>

</body>
</html>
